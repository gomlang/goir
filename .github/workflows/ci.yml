name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: gomlang/verification/.github/workflows/ecosystem-ci.yml@d7ee3a434f407da66a5e62ec590ed09adf5a164c
    with:
      module: goir
      verification-ref: d7ee3a434f407da66a5e62ec590ed09adf5a164c
