name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOML_VERSION: 0.1.57
      GOML_SHA256: c508acf89395d9d66cefd97d22649eccee732f63d6035c2155a795e1e939454b
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache: false
      - name: Install checksum-pinned GoML
        run: |
          mkdir -p _bootstrap/toolchain
          archive="_bootstrap/goml.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/gomlang/goml/releases/download/v$GOML_VERSION/goml-$GOML_VERSION-linux-amd64.tar.gz" \
            --output "$archive"
          echo "$GOML_SHA256  $archive" | sha256sum --check --status
          tar -xzf "$archive" --strip-components=1 -C _bootstrap/toolchain
          _bootstrap/toolchain/bin/goml __toolchain-finalize --prefix "$PWD/_bootstrap/toolchain"
          echo "$PWD/_bootstrap/toolchain/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: goml fmt --check
      - name: Test IR and native Go integration
        run: goml test --timeout 180s
      - name: Verify independent consumer
        run: goml verify --timeout 180s
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: goir-failure-artifacts
          path: _artifact/
          retention-days: 7
