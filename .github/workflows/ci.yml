name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: gomlang/verification/.github/workflows/ecosystem-ci.yml@5759fbca8db81054763382a143d86a160559873e
    with:
      module: goir
      verification-ref: 5759fbca8db81054763382a143d86a160559873e
