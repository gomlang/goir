name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: gomlang/verification/.github/workflows/ecosystem-ci.yml@68a4bd8ab818796b5fa64b9356c21882ead197d1
    with:
      module: goir
      verification-ref: 68a4bd8ab818796b5fa64b9356c21882ead197d1
